<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆熬夜大作战 - 卡牌肉鸽游戏</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function startGameClick() {
            console.log('startGameClick called');
            var startScreen = document.getElementById('start-screen');
            if (startScreen) {
                console.log('Hiding start screen');
                startScreen.style.display = 'none';
                startScreen.style.opacity = '0';
                startScreen.style.zIndex = '-1';
            }
            setTimeout(() => {
                console.log('Calling startGame');
                if (window.startGame) {
                    window.startGame();
                } else {
                    console.log('startGame not found');
                }
            }, 300);
        }
        
        function aboutGameClick() {
            alert('图书馆熬夜大作战\n\n我们的这款游戏讲述着一位同学熬夜赶论文的故事。主角要熬夜完成任务，期间会经历种种困难，逐渐提升自己，并在人间找回属于自己的温柔。游戏设计的模式是卡牌游戏，也就是需要玩家利用每回合限有的精力进行操作打败敌人。\n\n\n我们游戏与传统游戏的小小区别是我们的生命条严格来说有两条，也就是困意条和时间条，困意条是逐渐增加的，满了就会睡着，熬夜失败；时间条是逐渐减少的，时间条空了就相当于失败任务了。其次，我们设计的机制非常简单易懂，方便各位同学在匆忙的生活也能放松身心。\n\n\n你每个回合都会得到一定数量的卡牌，每张卡牌都有独特的效果和精力的需求，精力用完了就只能结束回合，要等待敌人完成回合后才能再次使用卡牌。顺带一提，专注值能提供额外的恢复和攻击，这不会反馈在卡牌描述里，但会体现在最后效果里。\n\n\n你现在的任务有三个，第一个任务是提升专注值至7，第二个任务是随意打败2个敌人，第三个任务是可选任务，是打败一位BOSS也就是「论文第一章」。至此，请加油吧。');
        }
        
        function exitGameClick() {
            if (confirm('确定要退出游戏吗？')) {
                window.close();
            }
        }
    </script>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    
    <!-- 开始界面 -->
    <div id="start-screen" class="start-screen">
        <img src="resource/screen.png" class="layer-bg">
        <div class="start-btn btn-start" id="start-btn" onclick="startGameClick()">
            <img src="resource/start.png" alt="开始工作">
        </div>
        <div class="start-btn btn-about" id="about-btn" onclick="aboutGameClick()">
            <img src="resource/aboutus.png" alt="关于我们">
        </div>
        <div class="start-btn btn-exit" id="exit-btn" onclick="exitGameClick()">
            <img src="resource/leave.png" alt="退出">
        </div>
    </div>
    
    <!-- 游戏容器 -->
    <div class="game-container">
        <!-- 顶部区域 -->
        <div class="top-area">
            <!-- 左上角CMD窗口风格信息面板 -->
            <div class="cmd-panel">
                <div class="cmd-content">
                    <div class="cmd-portrait" id="cmd-portrait">
                        <span class="empty-portrait">?</span>
                    </div>
                    <div class="cmd-info">
                        <div class="cmd-text">
                            <div class="cmd-label" id="cmd-label">选择卡牌:</div>
                            <div class="cmd-desc" id="cmd-desc">点击卡牌查看详情_</div>
                        </div>
                        <div class="cmd-footer">
                            <span class="cmd-card-name" id="cmd-card-name">-</span>
                            <span class="cmd-cost" id="cmd-cost">-</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 顶部进度条 -->
            <div class="progress-bar-container">
                <div class="progress-label">完成度</div>
                <div class="progress-bar">
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill" style="width: 30%"></div>
                    </div>
                </div>
            </div>
            
            <!-- 右上角功能按钮 -->
            <div class="top-buttons">
                <button class="top-btn reset-btn" id="reset-btn"></button>
                <button class="top-btn pause-btn" id="pause-btn"></button>
            </div>
        </div>
        
        <!-- 主战斗区域 -->
        <div class="main-battle-area">
            <!-- 左侧状态条区域 -->
            <div class="left-status-area">
                <div class="status-bar hp-bar">
                    <span class="status-icon">❤</span>
                    <div class="status-fill" id="hp-fill" style="width: 100%"></div>
                    <span class="status-value" id="hp-value">100/100</span>
                </div>
                <div class="status-bar kn-bar">
                    <span class="status-icon">😴</span>
                    <div class="status-fill" id="kn-fill" style="width: 20%"></div>
                    <span class="status-value" id="kn-value">20</span>
                </div>
                <div class="status-bar focus-bar">
                    <span class="status-icon">🎯</span>
                    <div class="status-fill" id="focus-fill" style="width: 20%"></div>
                    <span class="status-value" id="focus-value">2</span>
                </div>
            </div>
            
            <!-- 中心战斗舞台 -->
            <div class="center-stage">
                <div class="stage-content" id="stage-content">
                    <!-- 敌人信息 -->
                    <div class="enemy-panel" id="enemy-panel">
                        <div class="enemy-avatar" id="enemy-avatar"></div>
                        <div class="enemy-info-box">
                            <div class="enemy-name" id="enemy-name">敌人名称</div>
                            <div class="enemy-hp-bar">
                                <div class="enemy-hp-fill" id="enemy-hp-fill" style="width: 100%"></div>
                            </div>
                            <div class="enemy-hp-text" id="enemy-hp-text">HP: 100/100</div>
                        </div>
                    </div>
                </div>
                <div class="stage-label">当前项目</div>
                <button class="end-turn-btn" id="end-turn-btn">结束回合</button>
                <button class="rest-btn" id="rest-btn" style="display: none;">休息</button>
                <button class="next-level-btn" id="next-level-btn" style="display: none;">下一关</button>
            </div>
        </div>
        
        <!-- 底部操作区域 -->
        <div class="bottom-action-area">
            <!-- 左下角：头像 + 抽牌堆 -->
            <div class="bottom-left">
                <div class="player-avatar-card">
                    <div class="avatar-frame">
                        <div class="avatar-image" id="avatar-image"></div>
                    </div>
                    <div class="player-name">你</div>
                </div>
                <div class="deck-pile">
                    <div class="pile-icon" id="deck-icon"></div>
                    <div class="pile-count" id="deck-count">10</div>
                    <div class="pile-label">抽牌堆</div>
                </div>
            </div>
            
            <!-- 底部中间：手牌区 -->
            <div class="hand-area card-area" id="card-area">
                <div class="action-points">
                    <span class="ap-value" id="action-points">3/3</span>
                </div>
                <div class="cards-container" id="cards-container">
                    <!-- 卡牌动态生成 -->
                </div>
            </div>
            
            <!-- 右下角：弃牌堆 -->
            <div class="bottom-right">
                <div class="discard-pile">
                    <div class="discard-icon" id="discard-icon"></div>
                    <div class="discard-count" id="discard-count">5</div>
                    <div class="discard-label">弃牌堆</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 模态框 -->
    <div class="modal hidden" id="map-modal">
        <div class="modal-content">
            <h2>地图</h2>
            <div id="map-container"></div>
            <button class="btn btn-secondary" id="close-map-btn">关闭</button>
        </div>
    </div>

    <div class="modal hidden" id="game-over-modal">
        <div class="modal-content">
            <h2>游戏结束</h2>
            <p id="game-over-text"></p>
            <button class="btn btn-primary" id="restart-btn">重新开始</button>
        </div>
    </div>

    <div class="modal hidden" id="level-up-modal">
        <div class="modal-content">
            <h2>关卡完成！</h2>
            <p id="level-up-text"></p>
            <button class="btn btn-primary" id="continue-btn">继续</button>
        </div>
    </div>

    <div class="modal hidden" id="event-panel">
        <div class="modal-content">
            <h2>随机事件</h2>
            <div class="event-text" id="event-text"></div>
            <div class="event-options" id="event-options"></div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
